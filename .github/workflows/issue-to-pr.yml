name: Issue to PR

on:
  issues:
    types: [opened, edited]

jobs:
  open-pr:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'api-registration')
    runs-on: ubuntu-latest
    # 同一時間只跑一張申請，避免兩張 issue 同時改到同一份 registry
    concurrency:
      group: issue-to-pr
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          # 下載拖曳上傳的附件要帶 token
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/issue-to-files.mjs 2>&1 | tee -a "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"

      # 標題交給 parser 決定，申請人填什麼都會被正規化成 [動作] 產品編號 環境。
      # 這個 edit 是 GITHUB_TOKEN 發的，不會再觸發一次 workflow，所以不會迴圈。
      - name: Normalize the issue title
        if: steps.apply.outputs.issue_title != github.event.issue.title
        env:
          TITLE: ${{ steps.apply.outputs.issue_title }}
        run: gh issue edit "$ISSUE" --title "$TITLE"

      # PR 由 GITHUB_TOKEN 開，不會觸發 validate.yml，所以在這裡先驗
      - run: |
          npm run check 2>&1 | tee -a "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"

      # 上架順序：104z-apps 先、本 repo 後。所以先開 gateway 的 PR，拿到編號再開
      # 這邊的 PR，並把編號寫進內文供 require-gateway-pr 擋門檢查。
      - name: Check out 104z-apps
        uses: actions/checkout@v4
        with:
          # 測試環境可用 repo variable GATEWAY_REPO 指到替身
          repository: ${{ vars.GATEWAY_REPO || '104corp/104z-apps' }}
          token: ${{ secrets.Z_APPS_TOKEN }}
          path: .z-apps

      - id: gateway
        name: Open the 104z-apps PR
        env:
          GH_TOKEN: ${{ secrets.Z_APPS_TOKEN }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          TITLE: ${{ steps.apply.outputs.title }}
          PRODUCT: ${{ steps.apply.outputs.product_id }}
          GATEWAY_REPO: ${{ vars.GATEWAY_REPO || '104corp/104z-apps' }}
        run: |
          set -euo pipefail
          node scripts/generate-gateway-files.mjs "$PRODUCT" .z-apps --write 2>&1 | tee -a "$RUNNER_TEMP/apply.log"
          cd .z-apps
          if [ -z "$(git status --porcelain ha-ext-gw)" ]; then
            echo "::error::gateway 端沒有任何異動，請人工確認這次申請是否真的不需要上架"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A ha-ext-gw
          git commit -m "$TITLE (104ha-ext-gw-config#$ISSUE)"
          git push -f origin "$BRANCH"
          printf '由 104corp/104ha-ext-gw-config#%s 自動產生。\n\n### 異動內容\n\n%s\n\n這個 PR 要**先 merge**，104ha-ext-gw-config 的設定 PR 才解得開擋門。\n' \
            "$ISSUE" "${{ steps.apply.outputs.changes }}" > "$RUNNER_TEMP/gateway-body.md"
          gh pr view "$BRANCH" >/dev/null 2>&1 \
            || gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/gateway-body.md"
          echo "number=$(gh pr view "$BRANCH" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Check for a competing PR on the same product
        env:
          PREFIX: ${{ steps.apply.outputs.branch_prefix }}
          BRANCH: ${{ steps.apply.outputs.branch }}
        run: |
          set -euo pipefail
          duplicate=$(gh pr list --state open --limit 100 --json number,title,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"$PREFIX\")) | select(.headRefName != \"$BRANCH\")] | first // empty")
          if [ -n "$duplicate" ]; then
            number=$(printf '%s' "$duplicate" | jq -r .number)
            title=$(printf '%s' "$duplicate" | jq -r .title)
            gh issue comment "$ISSUE" --body "❌ ${{ steps.apply.outputs.product_id }} 已有進行中的申請 PR #${number}（${title}）。請先合併或關閉該 PR，再重新編輯這張 issue。"
            exit 1
          fi
          # 分支名不含 issue 編號，同產品同動作同環境的兩張 issue 會指到同一條分支
          existing=$(gh pr list --state open --head "$BRANCH" --json number,title,body --jq 'first // empty')
          if [ -n "$existing" ] \
            && ! printf '%s' "$existing" | jq -e --arg n "$ISSUE" '.body | test("Closes #" + $n + "\\b")' >/dev/null; then
            number=$(printf '%s' "$existing" | jq -r .number)
            title=$(printf '%s' "$existing" | jq -r .title)
            gh issue comment "$ISSUE" --body "❌ 分支 \`$BRANCH\` 上已有來自其他 issue 的 PR #${number}（${title}）。請先處理該 PR，再重新編輯這張 issue。"
            exit 1
          fi

      - name: Commit and open PR
        env:
          GATEWAY_REPO: ${{ vars.GATEWAY_REPO || '104corp/104z-apps' }}
        run: |
          set -euo pipefail
          title="${{ steps.apply.outputs.title }}"
          branch="${{ steps.apply.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A products
          git commit -m "$title (#$ISSUE)"
          git push -f origin "$branch"
          printf '由 #%s 自動產生，內容以該 issue 為準。\n\n### 異動內容\n\n%s\n\n### 上架\n\nDepends on %s#%s —— 該 PR merge 後，回到這裡 Re-run jobs 才解得開擋門。\n\nCloses #%s\n' \
            "$ISSUE" \
            "${{ steps.apply.outputs.changes }}" \
            "$GATEWAY_REPO" \
            "${{ steps.gateway.outputs.number }}" \
            "$ISSUE" > "$RUNNER_TEMP/pr-body.md"
          gh pr view "$branch" >/dev/null 2>&1 \
            || gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          gh issue comment "$ISSUE" --body "✅ 已開出兩個 PR，請**依序** merge：

          1. 上架（先）：${{ steps.gateway.outputs.url }}
          2. 設定（後）：$(gh pr view "$branch" --json url --jq .url)"

      - name: Report the failure on the issue
        if: failure()
        run: |
          {
            echo "❌ 申請未通過，修正後重新編輯這張 issue 即可重跑。"
            echo
            if [ -s "$RUNNER_TEMP/apply.log" ]; then
              echo '```'
              tail -n 40 "$RUNNER_TEMP/apply.log"
              echo '```'
              echo
            fi
            echo "[完整執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$RUNNER_TEMP/failure.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/failure.md"
