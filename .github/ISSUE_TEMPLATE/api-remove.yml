name: 申請移除
description: 下架指定的環境；全部環境都移除等於整個產品下架
title: "[移除] 產品編號 環境"
labels: ["api-registration", "request:remove"]
body:
  - type: markdown
    attributes:
      value: |
        **下架指定的環境**：只有勾選的環境會被刪除，沒勾的保留。
        把所有已註冊的環境都勾起來，等於整個產品下架（連 product.yaml 與 scope 一起刪除）。完整說明見 [README](https://github.com/KE-CY/test/blob/main/README.md)。
        標題不用自己想：送出後會依填寫內容自動改成 `[移除] 產品編號 環境`（例如 `[移除] F0055 lab stg`）。
        送出後會自動產生 PR 交由 API Center 審核；若驗證不通過會在這張 issue 留言列出每一項錯誤，修正內容後重新編輯 issue 即可重跑。
  - type: input
    id: product_id
    attributes:
      label: 產品編號
      description: |
        DevMaster 產品編號：**1 個大寫英文字母 + 4 位數字**，例如 `P0078`。
        必須是已註冊的產品。
      placeholder: P0078
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 產品負責人 email
      description: |
        必須是合法的 email 格式。
        填目前註冊的 email，不符會被擋下——這是「有沒有搞錯產品」的確認。
      placeholder: team-perf@104.com.tw
    validations:
      required: true
  - type: input
    id: base_path
    attributes:
      label: 對外路徑前綴
      description: |
        斜線開頭，之後第一個字必須是小寫英文，其餘只能是小寫英數或連字號，例如 `/perf`。不可重複使用其他產品已占用的前綴。
        填目前註冊的路徑，不符會被擋下——這是「有沒有搞錯產品」的確認。
      placeholder: /perf
    validations:
      required: true
  - type: dropdown
    id: environments
    attributes:
      label: 要移除的環境
      description: 只有勾選的環境會被刪除；**沒註冊過的環境會被擋下**。全部勾選等於整個產品下架。
      multiple: true
      options:
        - lab
        - stg
        - prod
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        移除後若保留的環境仍有 operation 引用到被刪掉的 scope，CI 會擋下這次申請。
  - type: checkboxes
    id: confirm
    attributes:
      label: 移除確認
      options:
        - label: 我確認勾選環境的 API 會全部下架，且已通知使用這些 API 的對象
          required: true
