name: 申請更新
description: 既有產品的後續調整：換 OpenAPI、新增或修改 scope、改負責人或路徑
title: "[更新] 產品編號"
labels: ["api-registration", "request:update"]
body:
  - type: markdown
    attributes:
      value: |
        **既有產品的後續調整**：換掉某環境的 OpenAPI、新增或修改 scope、變更產品負責人或路徑前綴。
        還沒建立過的環境請用「申請新增」。完整說明見 [README](https://github.com/KE-CY/test/blob/main/README.md)。
        標題不用自己想：送出後會自動改成與 PR 相同的格式（例如 `Hrmpro/register f0055 lab`）。
        送出後會自動產生 PR 交由 API Center 審核；若驗證不通過會在這張 issue 留言列出每一項錯誤，修正內容後重新編輯 issue 即可重跑。
  - type: input
    id: product_id
    attributes:
      label: 產品編號
      description: |
        DevMaster 產品編號：**1 個大寫英文字母 + 4 位數字**，例如 `P0078`。
        必須是已註冊的產品，否則請用「申請新增」。
      placeholder: P0078
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 產品負責人 email
      description: |
        必須是合法的 email 格式。
        這裡填的值就是變更後的值；沒有要改就填目前註冊的值。
      placeholder: team-perf@104.com.tw
    validations:
      required: true
  - type: input
    id: base_path
    attributes:
      label: 對外路徑前綴
      description: |
        斜線開頭，之後第一個字必須是小寫英文，其餘只能是小寫英數或連字號，例如 `/perf`。不可重複使用其他產品已占用的前綴。
        這裡填的值就是變更後的值；沒有要改就填目前註冊的值。**變更會改掉既有呼叫方的路徑**。
      placeholder: /perf
    validations:
      required: true
  - type: dropdown
    id: environments
    attributes:
      label: 要更新的環境
      description: 要換掉 OpenAPI 的環境，可多選；只改 scope 或負責人時免填。**還沒建立過的環境會被擋下**，那種情況請用「申請新增」。
      multiple: true
      options:
        - lab
        - stg
        - prod
  - type: textarea
    id: scopes
    attributes:
      label: Scopes
      description: |
        一行一個，格式 `code, 名稱, 說明`（說明本身可以含逗號）。
        - `code`：全小寫，**至少含一個點**，每一段以小寫英文開頭，其餘為小寫英數或連字號，例如 `perf.organization.read`。不需要用產品編號當前綴。
        - `名稱`、`說明`：不可空白。
        - 同一個產品的 code 不可重複。

        只列**本次要新增或修改**的 scope，沒列到的不受影響。新的 code 會新增，既有的 code 會覆蓋名稱與說明。**這裡不能刪除 scope。**
      placeholder: |
        perf.organization.read, 組織查詢, 允許查詢組織與部門資料
  - type: markdown
    attributes:
      value: |
        ### OpenAPI 文件

        只填要更新的環境；上傳的檔案會**整份取代**該環境現有的 OpenAPI，少掉的 operation 等於下架。
        **只接受拖曳上傳的 `.yaml` 附件** —— 不接受 `.json`，也不接受貼外部連結。DevMaster APIM 匯出的是 `.json`，請先轉成 YAML。

        文件必須符合：

        - OpenAPI **3.0 或 3.1**，不接受 Swagger 2.0
        - `servers` 必須且只能有一筆，是完整的 `http`/`https` URL
        - server URL 不可結尾為 `/`，也不可帶路徑、帳號密碼、query string 或 fragment
        - 至少要有一個 operation
        - path 斜線開頭、不可結尾斜線；每一段是小寫英數（可含 `.` `_` `~` `-`）或 `{參數名}`
        - path **不含** 上面填的對外路徑前綴
        - 每個 operation 要有**唯一**的 `operationId`
        - 每個 operation 要有 `x-ha-gw-scope`，且該 scope 必須已在上面的 Scopes 宣告過
  - type: textarea
    id: openapi_lab_file
    attributes:
      label: lab OpenAPI 檔案
      description: 把 .yaml 檔拖曳到這個欄位上傳
  - type: textarea
    id: openapi_stg_file
    attributes:
      label: stg OpenAPI 檔案
      description: 把 .yaml 檔拖曳到這個欄位上傳
  - type: textarea
    id: openapi_prod_file
    attributes:
      label: prod OpenAPI 檔案
      description: 把 .yaml 檔拖曳到這個欄位上傳
